<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/star.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>Over to You · The Hitchhiker's Guide to Trust</title>
<meta name="description" content="What does trust mean to you? Talk it through at the table, and leave your answer as a one-button voice note.">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0B0B0D;--cream:#F6F1E6;--blue:#1F4BFF;--pale:#8EA4FF;--muted:#9E998C;--line:rgba(246,241,230,.22);--red:#E0402F;
  --head:Anton,Impact,"Arial Narrow Bold",sans-serif;--body:"Space Grotesk","Segoe UI",Arial,sans-serif;--mono:"Space Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body)}
main{max-width:820px;margin:0 auto;padding:20px 16px 120px}
a{color:var(--pale)}
.micro{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.04em;line-height:1.55}
.top{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.top a{text-decoration:none;white-space:nowrap}
h1{font-family:var(--head);font-weight:400;text-transform:uppercase;font-size:clamp(58px,15vw,112px);line-height:.95;margin:20px 0 10px}
h1 span{color:var(--blue)}
.lede{font-size:clamp(19px,4.6vw,23px);line-height:1.38;margin:0 0 8px}
h2{font-family:var(--mono);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--pale);margin:34px 0 4px}
.card{display:block;text-decoration:none;color:inherit;padding:16px 0;border-bottom:1px solid var(--line)}
.card:hover .go,.card:focus-visible .go{text-decoration:underline}
.card .t{display:block;font-size:clamp(21px,5.2vw,27px);line-height:1.26;font-weight:700}
.card .go{display:block;margin-top:7px;color:var(--pale)}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--night) 34%);padding:30px 16px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.cta{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:12px;max-width:788px;margin:0 auto;padding:16px 20px;border-radius:40px;background:var(--red);color:var(--cream);text-decoration:none;font-family:var(--head);text-transform:uppercase;font-size:26px;letter-spacing:.03em;line-height:1}
.cta:hover{background:#EE5443}.cta i{width:15px;height:15px;border-radius:50%;background:var(--cream);flex:none}
.alt{margin-top:26px;color:var(--muted)}
/* just the one question: it is the page */
.one h2{display:none}.one .card{border-bottom:0;padding:26px 0 18px}.one .card .t{font-size:clamp(38px,10vw,76px);line-height:1.08}.one .card .go{font-size:14px;margin-top:14px}
.embed .one{columns:1!important}
.mine{display:block;margin-top:18px;padding:14px 16px;border:1.5px solid var(--blue);border-radius:6px;text-decoration:none;color:inherit;font-size:clamp(19px,4.8vw,23px);font-weight:700;line-height:1.25}
.mine span{display:block;margin-top:5px;color:var(--pale);font-weight:400}
/* inside the guide: the guide supplies the title, and wide screens get two columns */
.embed .top,.embed h1,.embed .lede{display:none}
.embed main{max-width:none;padding-top:4px}
.embed .cta{max-width:520px}
@media (min-width:900px){.embed #list{columns:2;column-gap:44px}.embed #list>div{break-inside:avoid}.embed h2{margin-top:18px}}
</style>
<script src="/mark.js"></script>
<script src="/questions.js?v=2"></script>
</head>
<body>
<main>
  <div class="top micro"><a id="home" href="/">← The guide</a><span id="night" style="text-align:right">Who owns the future?</span></div>
  <h1>Over to <span>you</span></h1>
  <p class="lede">Talk it through at your table. When you have an answer worth keeping, put a phone down and record it.</p>
  <a class="mine" id="mine" href="/record/?own=1">✎ Ask your own question<span class="micro">It stays on your phone</span></a>
  <div id="list"></div>
  <p class="alt micro">Prefer to write it? <a id="write" href="/#start">Leave a proverb or a poem →</a></p>
</main>
<div class="dock"><a class="cta" id="cta" href="/record/"><i></i>Record a voice note</a></div>
<script>
(function () {
  const $ = id => document.getElementById(id), withEvent = p => { const [a, h] = p.split('#'); return a + (DP.event ? (a.includes('?') ? '&' : '?') + 'event=' + DP.event : '') + (h ? '#' + h : ''); };
  const ONE = (window.OVER_TO_YOU_ALL || []).length === 1; let n = 0; const list = $('list'), EMBED = new URLSearchParams(location.search).has('embed');
  document.documentElement.classList.toggle('embed', EMBED);
  // inside the guide, the recorder is the guide's next scene; on its own, this page links to the standalone recorder
  const toRecord = (a, q) => { a.href = withEvent('/record/' + (q ? '?' + q : '')); if (EMBED && window.parent !== window && typeof window.parent.dpRecord === 'function') a.onclick = e => { e.preventDefault(); window.parent.dpRecord(q); }; };
  (window.OVER_TO_YOU || []).forEach(g => { const box = document.createElement('div'), h = document.createElement('h2'); h.textContent = g.group; box.append(h);
    g.q.forEach(text => { const a = document.createElement('a'); a.className = 'card'; toRecord(a, 'q=' + n++);
      const t = document.createElement('span'); t.className = 't'; t.textContent = text; const go = document.createElement('span'); go.className = 'go micro'; go.textContent = ONE ? 'Record your answer →' : 'Answer this one →'; a.append(t, go); box.append(a); }); list.append(box); });
  if (ONE) { list.classList.add('one'); list.after($('mine')); }
  toRecord($('cta'), ''); toRecord($('mine'), 'own=1'); $('home').href = withEvent('/'); $('write').href = withEvent('/#start'); if (EMBED) $('write').target = '_top';
  (async () => { try { const d = await (await fetch('/api/events', {cache: 'no-store'})).json(), me = d.events.find(e => e.id === (DP.event || d.default)); if (me) $('night').textContent = me.name; } catch (e) {} })();
})();
</script>
</body>
</html>
